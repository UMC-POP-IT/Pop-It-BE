plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id "io.sentry.jvm.gradle" version "6.17.0"
}

group = 'com.popIt'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.springframework.boot:spring-boot-h2console'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.security:spring-security-oauth2-client'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.1'

	// Jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	implementation 'org.springframework.boot:spring-boot-configuration-processor'

	// OAuth
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// AWS SDK v2 - S3 (presigned URL 발급 포함)
	implementation platform('software.amazon.awssdk:bom:2.47.1')
	implementation 'software.amazon.awssdk:s3'

	// RestClient
	implementation 'org.springframework.boot:spring-boot-starter-restclient'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// FlyWay
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// Testcontainers
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	// monitoring
	implementation 'io.micrometer:micrometer-registry-prometheus' // Prometheus
}

tasks.named('test') {
	useJUnitPlatform()
}

sentry {
	includeSourceContext = true

	org = "popit"
	projectName = "java-spring-boot"
	authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

// 로컬은 SENTRY_AUTH_TOKEN이 없으니 업로드 태스크를 건너뜀 (CI/prod에서는 실제 env로 주입되어 그대로 실행)
// 빈 문자열/공백인 경우도 유효하지 않은 토큰이므로 건너뛴다 (예: GitHub secret 미설정 시 "" 전달됨)
tasks.named("sentryUploadSourceBundleJava") {
	onlyIf { System.getenv("SENTRY_AUTH_TOKEN")?.trim() }
}