# 이 파일은 배포되지 않습니다 (백업 전용)
#
# EC2의 ~/popit/nginx/conf.d/default.conf 사본이며, 배포 파이프라인은 이 파일을 복사하지 않습니다.
# conf.d가 bind mount라 파일만 바꿔도 컨테이너가 재생성되지 않아 nginx reload가 별도로 필요하고,
# 설정 오류 시 HTTPS가 끊기기 때문에 자동 동기화 대상에서 제외했습니다.
#
# 실제 반영은 EC2에서 직접 수정 후 아래를 실행해야 합니다.
# docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload
# 서버에서 수정했다면 이 파일에도 반드시 반영할 것.

# 어느 server_name에도 매칭되지 않는 요청(Host 헤더 위조 등)은 여기로 떨어진다.
# 응답 없이 연결을 끊어 $host 기반 오픈 리다이렉트를 차단한다
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP: 인증 챌린지 + https 리다이렉트
server {
    listen 80;
    server_name api.popit.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://api.popit.co.kr$request_uri;
    }
}

# HTTPS: 백엔드 API
server {
    listen 443 ssl;
    server_name api.popit.co.kr;

    ssl_certificate     /etc/letsencrypt/live/api.popit.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.popit.co.kr/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}