name: Deploy to EC2

on:
  push:
    branches: [ develop ]      # develop에 push(PR 머지) 시 자동 실행
  workflow_dispatch:            # 필요하면 Actions 탭에서 수동 실행도 가능

env:
  IMAGE: ghcr.io/umc-pop-it/pop-it-be:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 이미지 빌드 & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64      # EC2가 x86이라 반드시 amd64
          tags: ${{ env.IMAGE }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: compose 파일 동기화
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/prometheus/prometheus.yml"
          target: "~/popit/"
          strip_components: 1

      - name: EC2 SSH 접속 → pull & 재기동
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/popit
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            
            # 헬스체크: 최대 60초간 응답 대기
            echo "헬스체크 시작..."
            for i in $(seq 1 12); do
              if docker compose exec -T nginx wget -q -O /dev/null http://app:9090/actuator/health; then
                echo "배포 성공 (HTTP $CODE)"
                exit 0
              fi
              echo "대기 중... ($i/12, 현재 응답: $CODE)"
              sleep 5
            done

            echo "헬스체크 실패. 컨테이너 상태:"
            docker compose ps
            echo "헬스체크 실패. 앱 로그:"
            docker compose logs --tail=50 app
            exit 1