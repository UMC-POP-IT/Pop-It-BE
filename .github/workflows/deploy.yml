name: Deploy to EC2

on:
  push:
    branches: [ develop ]      # develop에 push(PR 머지) 시 자동 실행
  workflow_dispatch:            # 필요하면 Actions 탭에서 수동 실행도 가능

env:
  IMAGE: ghcr.io/umc-pop-it/pop-it-be:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: 이미지 빌드 & push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64      # EC2가 x86이라 반드시 amd64
          tags: ${{ env.IMAGE }}

      - name: EC2 SSH 접속 → pull & 재기동
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/popit
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f